{% comment %}Floating bulk-confirm bar. Requires the enclosing x-data="bulkSelect()" scope
(selected[], allSelected, toggleAll()) from base.html. Only visible once something is selected.{% endcomment %}
<div x-show="selected.length > 0" x-cloak
     x-transition:enter="transition ease-out duration-150"
     x-transition:enter-start="opacity-0 translate-y-2"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-100"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 translate-y-2"
     class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 flex items-center gap-4 px-5 py-3 rounded-full border shadow-lg"
     style="background: var(--color-surface); border-color: var(--color-border);">
    <span class="text-sm font-medium whitespace-nowrap" style="color: var(--color-text);" x-text="selected.length + ' ta belgilandi'"></span>
    <button type="button" @click="selected = []; allSelected = false"
        class="rounded-md px-3 py-2 text-sm font-medium whitespace-nowrap" style="background: var(--color-surface-muted); color: var(--color-text);">
        Bekor qilish
    </button>
    <button type="submit"
        class="rounded-md px-4 py-2 text-sm font-medium whitespace-nowrap" style="background: var(--color-brand); color: var(--color-brand-foreground);">
        Tasdiqlash
    </button>
</div>
