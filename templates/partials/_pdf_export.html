{% comment %}
Lazy html2pdf export of #invoice. Defines generatePDF(); the ~400 KB bundle is
fetched only on first click. Params: pdf_name (file name without .pdf).
{% endcomment %}
<script>
    function generatePDF(button) {
        const run = () => {
            html2pdf().set({
                margin: 0,
                filename: '{{ pdf_name|default:"hisobot"|escapejs }}-' + new Date().toISOString().slice(0, 10) + '.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 2, useCORS: true, scrollY: 0,
                               windowWidth: document.body.scrollWidth, windowHeight: document.body.scrollHeight },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
            }).from(document.getElementById('invoice')).save().finally(() => { if (button) button.disabled = false; });
        };
        if (button) button.disabled = true;
        if (window.html2pdf) return run();
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
        s.integrity = 'sha384-Yv5O+t3uE3hunW8uyrbpPW3iw6/5/Y7HitWJBLgqfMoA36NogMmy+8wWZMpn3HWc';
        s.crossOrigin = 'anonymous';
        s.onload = run;
        s.onerror = () => { if (button) button.disabled = false; alert('PDF kutubxonasi yuklanmadi. Internetni tekshiring.'); };
        document.head.appendChild(s);
    }
</script>
