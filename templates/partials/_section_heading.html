{% comment %}
Section heading above a stat-card grid. Params: title, icon (boxicons),
icon_bg / icon_color (CSS colors, optional — defaults to brand tint),
chip (optional label text, e.g. "Click + Terminal + Bank").
{% endcomment %}
<div class="flex items-center gap-2 mb-3">
    <span class="w-8 h-8 rounded-md flex items-center justify-center shrink-0"
          style="background: {{ icon_bg|default:'rgba(105, 108, 255, 0.12)' }}; color: {{ icon_color|default:'var(--color-brand)' }};">
        <i aria-hidden="true" class="bx {{ icon }}"></i>
    </span>
    <h2 class="text-base font-semibold" style="color: var(--color-text);">{{ title }}</h2>
    {% if chip %}
    <span class="text-xs px-2 py-0.5 rounded-full" style="background: var(--color-surface-muted); color: var(--color-text-muted);">{{ chip }}</span>
    {% endif %}
</div>
