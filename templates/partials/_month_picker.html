{% comment %}
Month selector for the dashboard/finance pages. Reads the page's `from`
(YYYY-MM-DD) to preselect, and on change reloads with from/to spanning the
chosen month while keeping every other query param.
{% endcomment %}
<select class="finance-month-picker form-select rounded-md" aria-label="Oy tanlash" data-selected="{{ from|slice:':7' }}"
        onchange="const [y, m] = this.value.split('-'); if (!y || !m) return;
                  const last = new Date(Number(y), Number(m), 0).getDate();
                  const p = new URLSearchParams(window.location.search);
                  p.set('from', `${y}-${m}-01`); p.set('to', `${y}-${m}-${String(last).padStart(2, '0')}`);
                  window.location.search = p.toString();"></select>
<script>
    (function () {
        const select = document.currentScript.previousElementSibling;
        const names = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentabr', 'Oktabr', 'Noyabr', 'Dekabr'];
        const selected = select.dataset.selected, now = new Date(), keys = [];
        for (let i = 0; i < 36; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            keys.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
        }
        if (/^\d{4}-\d{2}$/.test(selected) && !keys.includes(selected)) keys.push(selected);
        keys.sort().reverse();
        select.innerHTML = keys.map(function (k) {
            const parts = k.split('-');
            return '<option value="' + k + '"' + (k === selected ? ' selected' : '') + '>' + names[Number(parts[1]) - 1] + ' ' + parts[0] + '</option>';
        }).join('');
    })();
</script>
