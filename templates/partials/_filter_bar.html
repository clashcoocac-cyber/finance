{% comment %}
Params: action, date_from, date_to, search, selected_categories, category_options.
Optional: type_filter (truthy) + type_value — adds a "Tranzaksiya turi" select (income/expense/xarajat).
{% endcomment %}
<form method="get" action="{{ action }}" class="space-y-3">
    <div class="grid grid-cols-1 md:grid-cols-{% if type_filter %}5{% else %}4{% endif %} gap-3">
        <div>
            <label class="block text-xs font-medium mb-1" style="color: var(--color-text-muted);">Boshlanish sanasi</label>
            <input type="date" name="from" value="{{ date_from }}" class="w-full px-3 py-2 border rounded-lg text-sm" style="border-color: var(--color-border);">
        </div>
        <div>
            <label class="block text-xs font-medium mb-1" style="color: var(--color-text-muted);">Tugash sanasi</label>
            <input type="date" name="to" value="{{ date_to }}" class="w-full px-3 py-2 border rounded-lg text-sm" style="border-color: var(--color-border);">
        </div>
        {% if type_filter %}
        <div>
            <label class="block text-xs font-medium mb-1" style="color: var(--color-text-muted);">Tranzaksiya turi</label>
            <select name="type" class="w-full px-3 py-2 border rounded-lg text-sm" style="border-color: var(--color-border);">
                <option value="">Barchasi</option>
                <option value="income" {% if type_value == 'income' %}selected{% endif %}>Kirimlar</option>
                <option value="expense" {% if type_value == 'expense' %}selected{% endif %}>Chiqimlar</option>
                <option value="xarajat" {% if type_value == 'xarajat' %}selected{% endif %}>Xarajatlar</option>
            </select>
        </div>
        {% endif %}
        <div class="relative" x-data="{ open: false, selectedCats: [{% for c in selected_categories %}'{{ c|escapejs }}'{% if not forloop.last %}, {% endif %}{% endfor %}] }">
            <label class="block text-xs font-medium mb-1" style="color: var(--color-text-muted);">Kategoriya</label>
            <button type="button" @click="open = !open" class="w-full px-3 py-2 border rounded-lg text-sm text-left" style="border-color: var(--color-border);">
                <span x-text="selectedCats.length + ' tanlangan'"></span>
            </button>
            <div x-show="open" @click.outside="open = false" x-cloak
                class="absolute z-10 mt-1 w-full rounded-lg border shadow-lg p-1.5 max-h-56 overflow-y-auto" style="background: var(--color-surface); border-color: var(--color-border);">
                {% for cat in category_options %}
                <label class="flex items-center justify-between gap-2 px-3 py-2 text-sm rounded-lg cursor-pointer transition-colors hover:bg-[var(--color-surface-muted)]"
                    :style="'color: var(--color-text);' + (selectedCats.includes('{{ cat.name|escapejs }}') ? ' background: var(--color-surface-muted);' : '')"
                    @click.prevent="selectedCats.includes('{{ cat.name|escapejs }}') ? selectedCats = selectedCats.filter(v => v !== '{{ cat.name|escapejs }}') : selectedCats.push('{{ cat.name|escapejs }}')">
                    <span>{{ cat.name }}</span>
                    <i x-show="selectedCats.includes('{{ cat.name|escapejs }}')" x-cloak class="bx bx-check shrink-0" style="color: var(--color-brand);"></i>
                    <input type="checkbox" name="category" value="{{ cat.name }}" class="sr-only" :checked="selectedCats.includes('{{ cat.name|escapejs }}')">
                </label>
                {% endfor %}
            </div>
        </div>
        <div>
            <label class="block text-xs font-medium mb-1" style="color: var(--color-text-muted);">Qidiruv</label>
            <input type="text" name="q" value="{{ search|default:'' }}" placeholder="Operator, kategoriya..." class="w-full px-3 py-2 border rounded-lg text-sm" style="border-color: var(--color-border);">
        </div>
    </div>
    <button type="submit" class="rounded-lg px-4 py-2.5 text-sm font-medium inline-flex items-center gap-2" style="background: var(--color-brand); color: var(--color-brand-foreground);">
        <i class="bx bx-search"></i>
        Filtrlarni qo'llash
    </button>
</form>
