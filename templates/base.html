{% load static %}

<!DOCTYPE html>
<html lang="uz" class="light-style" data-theme="theme-default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F8F7FA">
    <title>{% block title %}Moliyaviy Boshqaruv Tizimi{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'sneat/vendor/fonts/boxicons.css' %}">
    <link rel="stylesheet" href="{% static 'sneat/vendor/css/core.css' %}">
    <link rel="stylesheet" href="{% static 'sneat/vendor/css/theme-default.css' %}">
    <link rel="stylesheet" href="{% static 'sneat/assets/css/demo.css' %}">
    {# runserver serves static uncached-by-name; bust the browser cache on every load in DEBUG. Production hashes filenames (manifest storage). #}
    <link rel="stylesheet" href="{% static 'sneat/finance.css' %}{% if debug %}?v={% now 'U' %}{% endif %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css" rel="stylesheet"
          integrity="sha384-RkASv+6KfBMW9eknReJIJ6b3UnjKOKC5bOUaNgIY778NFbQ8MtWq9Lr/khUgqtTt" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind's preflight resets h1-h6 to `font-size: inherit; font-weight: inherit`,
        // which silently flattens every Sneat heading (an h4 ends up smaller than the
        // paragraph under it). Sneat's core.css is the base layer here, so keep the
        // utilities and drop the reset. Remove this whole script once the last template
        // is off Tailwind.
        tailwind.config = { corePlugins: { preflight: false } };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"
        integrity="sha384-5JqMv4L/Xa0hfvtF06qboNdhvuYXUku9ZrhZh3bSk8VXF0A/RuSLHpLsSV9Zqhl6"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.14.1/dist/cdn.min.js"
        integrity="sha384-bKXNU7o2Y3Uk/F2PB6U0bMyGZf6pLDnePM70U7sTE3cXUQ+JLgzrr/kwipEh0p23" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"
        integrity="sha384-l8f0VcPi/M1iHPv8egOnY/15TDwqgbOR1anMIJWvU6nLRgZVLTLSaNqi/TOoT5Fh"
        crossorigin="anonymous" defer></script>
    <style>
        :root {
            /* Sneat-inspired palette: soft lavender page background, white cards,
               violet brand accent, light sidebar. */
            --color-bg: #F8F7FA;
            --color-surface: #FFFFFF;
            --color-surface-muted: #F5F5F9;
            --color-border: #E7E7EF;
            --color-text: #32475C;
            --color-text-muted: #6B7A90;
            --color-brand: #5A5DFA;
            --color-brand-foreground: #FFFFFF;
            --color-positive: #3E9B00;
            --color-positive-bg: #E8FBDD;
            --color-negative: #E61B21;
            --color-negative-bg: #FFE0E1;
            --color-pending: #D98E00;
            --color-pending-bg: #FFF3D9;

            --color-sidebar-bg: #FFFFFF;
            --color-sidebar-border: #E7E7EF;
            --color-sidebar-text: #384551;
            --color-sidebar-text-muted: #8F9BAA;
            --color-sidebar-active-bg: rgba(105, 108, 255, 0.12);
            --color-sidebar-active-text: #696CFF;

            --shadow-card: 0 2px 6px 0 rgba(67, 89, 113, 0.12);
        }
        /* Light-only palette. Sneat's core.css and finance.css hardcode light
           surfaces/text, so a token-level dark swap left dark text on dark
           cards. Add dark mode by theming those files too, not here. */
        body {
            font-family: 'Public Sans', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'cv11', 'ss01';
        }
        .money { font-variant-numeric: tabular-nums; font-family: 'Public Sans', sans-serif; letter-spacing: -0.01em; }
        .fade-in { animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        [x-cloak] { display: none !important; }
        .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange,
        .flatpickr-day.selected.inRange, .flatpickr-day.startRange.inRange, .flatpickr-day.endRange.inRange,
        .flatpickr-day.selected:focus, .flatpickr-day.startRange:focus, .flatpickr-day.endRange:focus,
        .flatpickr-day.selected:hover, .flatpickr-day.startRange:hover, .flatpickr-day.endRange:hover {
            background: var(--color-brand); border-color: var(--color-brand);
        }
        .flatpickr-day.inRange { background: var(--color-surface-muted); border-color: var(--color-surface-muted); box-shadow: -5px 0 0 var(--color-surface-muted), 5px 0 0 var(--color-surface-muted); }
        .flatpickr-day.today { border-color: var(--color-brand); }
        /* Sneat-style soft elevation on every surface card (border + surface-bg combo). */
        [class*="rounded-lg"][style*="var(--color-surface)"]:not([style*="var(--color-surface-muted)"]) { box-shadow: var(--shadow-card); }
        /* Sneat's own core.css supplies focus styling (including .input-group-merge,
           which a blanket border-color override would split in half). */
    </style>
</head>
<body class="min-h-screen">
{% block content %}{% endblock %}
<script>
    function bulkSelect() {
        return {
            selected: [],
            allSelected: false,
            toggleAll(event) {
                const checked = event.target.checked;
                this.selected = checked
                    ? Array.from(document.querySelectorAll('input[name="report_ids"]')).map(el => el.value)
                    : [];
            },
        };
    }
</script>
<script src="{% static 'sneat/vendor/js/bootstrap.js' %}"></script>
</body>
</html>
