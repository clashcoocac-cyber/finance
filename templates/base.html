<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Moliyaviy Boshqaruv Tizimi{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"
          integrity="sha384-42kyIPf7HDYLkGffmxDhSx/3Z/53wGBs3nD6wEFxsbeDc7rMO6mkYbkAcpRsnMU2" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"
        integrity="sha384-l8f0VcPi/M1iHPv8egOnY/15TDwqgbOR1anMIJWvU6nLRgZVLTLSaNqi/TOoT5Fh"
        crossorigin="anonymous" defer></script>
    <style>
        :root {
            /* Sneat-inspired palette: soft lavender page background, white cards,
               violet brand accent, light sidebar. */
            --color-bg: #F8F7FA;
            --color-surface: #FFFFFF;
            --color-surface-muted: #F5F5F9;
            --color-border: #E7E7EF;
            --color-text: #32475C;
            --color-text-muted: #6B7A90;
            --color-brand: #696CFF;
            --color-brand-foreground: #FFFFFF;
            --color-positive: #56CA00;
            --color-positive-bg: #E8FBDD;
            --color-negative: #FF4C51;
            --color-negative-bg: #FFE0E1;
            --color-pending: #FFB400;
            --color-pending-bg: #FFF3D9;

            --color-sidebar-bg: #FFFFFF;
            --color-sidebar-border: #E7E7EF;
            --color-sidebar-text: #6B7A90;
            --color-sidebar-text-muted: #A7B4C2;
            --color-sidebar-active-bg: #696CFF;
            --color-sidebar-active-text: #FFFFFF;

            --shadow-card: 0 2px 10px rgba(105, 108, 255, 0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --color-bg: #25293C;
                --color-surface: #2F3349;
                --color-surface-muted: #383C55;
                --color-border: #434968;
                --color-text: #E7E3FC;
                --color-text-muted: #A7A3C0;

                --color-sidebar-bg: #2F3349;
                --color-sidebar-border: #434968;
                --color-sidebar-text: #A7A3C0;
                --color-sidebar-text-muted: #6B7290;

                --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.3);
            }
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'cv11', 'ss01';
        }
        .money { font-variant-numeric: tabular-nums; font-family: 'Hanken Grotesk', 'Inter', sans-serif; letter-spacing: -0.01em; }
        .fade-in { animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        [x-cloak] { display: none !important; }
        /* Sneat-style soft elevation on every surface card (border + surface-bg combo). */
        [class*="rounded-xl"][style*="var(--color-surface)"]:not([style*="var(--color-surface-muted)"]) { box-shadow: var(--shadow-card); }
    </style>
</head>
<body class="min-h-screen">
{% block content %}{% endblock %}
<script>
    function bulkSelect() {
        return {
            selected: [],
            allSelected: false,
            toggleAll(event) {
                const checked = event.target.checked;
                this.selected = checked
                    ? Array.from(document.querySelectorAll('input[name="report_ids"]')).map(el => el.value)
                    : [];
            },
        };
    }
</script>
</body>
</html>
